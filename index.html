<!-- 1. ПОДКЛЮЧАЕМ VK BRIDGE -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<!-- 2. ИНТЕГРАЦИЯ ВК И ПЕРЕХВАТЧИК СОХРАНЕНИЙ -->
<script>
  // Функция собирает весь текущий прогресс в строку
  function getSavesString() {
    var obj = {};
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      obj[key] = localStorage.getItem(key);
    }
    return JSON.stringify(obj);
  }

  // Перехватываем стандартное сохранение игры, чтобы оно дублировалось в ВК
  function setupStorageInterceptor() {
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
      originalSetItem.apply(this, arguments); // Сохраняем в браузере как обычно
      
      // Отправляем копию всех сохранений в облако ВК
      vkBridge.send('VKWebAppStorageSet', {
        key: 'game_progress',
        value: getSavesString()
      }).catch(err => console.log('Ошибка сохранения в ВК:', err));
    };
  }

  // Динамическая загрузка скриптов игры (чтобы запустить их ТОЛЬКО после получения сохранений)
  function loadGameScripts() {
    var gameScript = document.createElement('script');
    gameScript.src = 'game.js';
    gameScript.onload = function() {
      var allScript = document.createElement('script');
      allScript.src = 'all.js';
      document.head.appendChild(allScript);
    };
    document.head.appendChild(gameScript);
  }

  // ИНИЦИАЛИЗАЦИЯ ВК
  vkBridge.send('VKWebAppInit').then((data) => {
    if (data.result) {
      console.log('VK Bridge инициализирован');

      // ЗАПРОС БАННЕРА
      vkBridge.send('VKWebAppShowBannerAd', { banner_location: 'bottom' })
        .catch(err => console.log('Ошибка баннера:', err));

      // ЗАГРУЗКА СОХРАНЕНИЙ ИЗ ВК
      vkBridge.send('VKWebAppStorageGet', { keys: ['game_progress'] })
        .then((res) => {
          if (res.keys && res.keys[0].value) {
            try {
              var saves = JSON.parse(res.keys[0].value);
              // Записываем данные из облака в локальное хранилище до старта игры
              for (var k in saves) {
                localStorage.setItem(k, saves[k]); 
              }
            } catch (e) { console.error('Ошибка парсинга сохранений', e); }
          }
        })
        .finally(() => {
          // Запускаем перехватчик и загружаем игру
          setupStorageInterceptor();
          loadGameScripts();
        });
    }
  }).catch((err) => {
    // Если запускаем вне ВК (для тестов на ПК), игра всё равно запустится
    setupStorageInterceptor();
    loadGameScripts();
  });
</script>

<!-- Обрати внимание: мы удалили <script src="game.js"> и <script src="all.js"> отсюда. 
     Они теперь загружаются через функцию loadGameScripts() -->
</head>
